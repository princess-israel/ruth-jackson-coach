<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program | Timshi Universal Institute</title>
<meta name="description" content="Enrol in a self-paced $79 certificate course with Timshi Universal Institute.">
<meta name="theme-color" content="#070e29">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/tui.css">
<style>
  .prog-hero{display:grid;grid-template-columns:1.3fr .9fr;gap:46px;align-items:start}
  .buy-card{position:sticky;top:100px;background:var(--navy-850);border:1px solid var(--line-strong);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
  .buy-price{font-family:var(--font-head);font-size:3rem;font-weight:800;color:var(--gold);line-height:1}
  .incl{list-style:none;padding:0;margin:20px 0}
  .incl li{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:.92rem;color:var(--muted)}
  .incl li::before{content:"✓";color:var(--status-online);font-weight:800}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(3,6,18,.78);backdrop-filter:blur(6px);z-index:300;display:none;place-items:center;padding:20px}
  .modal-bg.open{display:grid}
  .modal{width:100%;max-width:460px;background:var(--navy-850);border:1px solid var(--line-strong);border-radius:22px;padding:32px;box-shadow:var(--shadow);animation:popmsg .35s ease}
  .modal h3{margin-bottom:6px}
  .pay-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .demo-note{font-size:.78rem;color:var(--muted-2);text-align:center;margin-top:14px}
  @media(max-width:880px){.prog-hero{grid-template-columns:1fr}.buy-card{position:static}}
</style>
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="index.html"><img class="tui-mark" src="assets/img/tui-logo.png" alt="Timshi Universal Institute"><span class="tui-name">Timshi Universal Institute<small>Learning &amp; Training</small></span></a>
    <nav><ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="programs.html">Programs</a></li>
      <li><a href="customer-service.html">Customer Service</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul></nav>
    <div class="nav-cta">
      <a class="btn btn-whatsapp btn-sm" href="https://wa.me/254729384374" target="_blank" rel="noopener">WhatsApp</a>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="page-pad section" id="prog-root">
  <div class="container"><p class="muted">Loading program…</p></div>
</main>

<footer class="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function(){
  const id = new URLSearchParams(location.search).get("id");
  const root = document.getElementById("prog-root");
  const all = (window.RJ_PROGRAMS || []).concat(window.RJ_SIGNATURE ? [window.RJ_SIGNATURE] : []);
  const p = all.find(x => x.id === id);
  if (!p) { root.innerHTML = `<div class="container center"><h2>Program not found</h2><p class="muted">It may have moved.</p><a class="btn btn-gold" href="programs.html">Back to programs</a></div>`; return; }
  const free = !p.price;
  p.tags = Array.isArray(p.tags) ? p.tags : [];
  p.outcomes = Array.isArray(p.outcomes) ? p.outcomes : [];
  document.title = `${p.title} ${free ? "(Custom training)" : "($" + p.price + " certificate course)"} | Timshi Universal Institute`;
  const md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute("content", p.short || p.summary || "");
  const img = p.image || (window.RJ_PROGRAM_IMG && RJ_PROGRAM_IMG[p.id]);
  const wa = "https://wa.me/254729384374?text=" + encodeURIComponent(`Hello Timshi Universal Institute! I would like to enrol in: ${p.title}`);
  root.innerHTML = `<div class="container">
    <a href="programs.html" class="muted" style="font-size:.9rem">← All programs</a>
    <div class="prog-hero" style="margin-top:20px">
      <div>
        ${img ? `<img class="prog-detail-img" src="${img}" alt="${p.title}">` : ""}
        <div class="eyebrow">${free ? "Custom Training" : "$" + p.price + " · Certificate Course"}</div>
        <h1 style="font-size:clamp(2rem,4vw,3.2rem)">${p.title}</h1>
        <p class="muted" style="font-size:1.1rem">${p.short}</p>
        <div class="tags" style="margin:18px 0">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
        <p>${p.summary || ""}</p>
        <h3 style="margin-top:34px">What you'll be able to do</h3>
        <ul class="cred-list">${p.outcomes.map(o => `<li><span class="ck">✓</span><span>${o}</span></li>`).join("")}</ul>
        ${(window.RJ_PROGRAM_MODULES && RJ_PROGRAM_MODULES[p.id]) ? `
        <h3 style="margin-top:34px">Course modules <span class="muted" style="font-size:.82rem;font-weight:400">· tap any module to see what to expect</span></h3>
        <div class="modules">${RJ_PROGRAM_MODULES[p.id].map((m, i) => `
          <details class="module"${i === 0 ? " open" : ""}>
            <summary><span class="mod-num">${String(i + 1).padStart(2, "0")}</span><span class="mod-title">${m.t}</span><span class="mod-chev">▾</span></summary>
            <div class="mod-body">${m.points ? `<ul class="mod-points">${m.points.map(pt => `<li>${pt}</li>`).join("")}</ul>` : (m.d || "")}</div>
          </details>`).join("")}</div>` : ""}
        ${window.accreditationHTML ? window.accreditationHTML() : ""}
        ${free ? "" : `
        <h3 style="margin-top:30px">How it works</h3>
        <div class="steps" style="grid-template-columns:repeat(3,1fr);margin-top:16px">
          <div class="card step"><h3>Enrol</h3><p class="muted">Message us on WhatsApp and pay $${p.price} securely.</p></div>
          <div class="card step"><h3>Get access</h3><p class="muted">We send your course link and instructions.</p></div>
          <div class="card step"><h3>Learn &amp; certify</h3><p class="muted">Finish at your pace, earn your certificate.</p></div>
        </div>`}
      </div>
      <aside class="buy-card">
        ${free
          ? `<div class="buy-price" style="font-size:2rem">Custom quote</div>
             <p class="muted" style="font-size:.9rem;margin-top:6px">Tailored to your team &amp; needs</p>
             <ul class="incl"><li>Live training by expert trainers</li><li>Built around your customers</li><li>Team workshops available</li><li>Scripts &amp; standards you keep</li></ul>
             <a class="btn btn-gold btn-block" href="customer-service.html">Request custom training</a>
             <a class="btn btn-whatsapp btn-block" href="${wa}" target="_blank" rel="noopener" style="margin-top:10px">WhatsApp</a>`
          : `<div class="buy-price">$${p.price}</div>
             <p class="muted" style="font-size:.9rem;margin-top:6px">One-time · lifetime access</p>
             <ul class="incl"><li>${p.lessons} lessons · ${p.hours} hours</li><li>Self-paced, learn anytime</li><li>Certificate of completion</li><li>Templates you keep forever</li><li>Support from our team</li></ul>
             <a class="btn btn-whatsapp btn-block" href="${wa}" target="_blank" rel="noopener">WhatsApp to enrol</a>
             <a class="btn btn-ghost btn-block" href="contact.html" style="margin-top:10px">Ask a question</a>`}
      </aside>
    </div>
  </div>`;
})();
</script>
</body>
</html>
