name: Publish to coachruthjackson.com (FTP)

# Direct FTP publish: on every push to main, upload the changed site files
# straight into the live document root. This runs on GitHub's own runners and
# writes to the server over FTP, so it does NOT depend on cPanel's Git
# "Deploy" step (which silently stopped landing files) or on the server being
# able to clone from GitHub.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    the FTP host, e.g. ftp.coachruthjackson.com (or the server hostname)
#   FTP_USERNAME  the full FTP username, e.g. deploy@coachruthjackson.com
#   FTP_PASSWORD  that FTP account's password
#
# The FTP account MUST have its home directory set to the live site folder
# (/home/irelandc/coachruthjackson.com) so that server-dir "./" is the docroot.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The FTP account is rooted at the live docroot, so upload there.
          local-dir: ./
          server-dir: ./
          # Never upload/delete server-only files: secrets, runtime data written
          # by the admin panel, git internals, CI, and repo docs. Excluded paths
          # are left untouched on the server.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            api/pesapal/config.php
            data/articles.json
            data/programs.json
            data/affiliates.json
            data/ipn_id.txt
