<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0B1F3A url(slide1-bg-nomoon.jpg) center bottom/1080px auto no-repeat;font-family:Montserrat,Arial,sans-serif;color:#fff;position:relative;overflow:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0B1F3A 0%,#0B1F3A 33%,#0B1F3A 45%,rgba(11,31,58,.6) 62%,rgba(11,31,58,.3) 78%,rgba(11,31,58,.75) 100%)}
.frame{position:absolute;inset:40px;border:2px solid rgba(255,201,51,.75)}
.corner{position:absolute;width:70px;height:70px;border:6px solid #FFC933}
.tl{top:28px;left:28px;border-right:none;border-bottom:none}
.br{bottom:28px;right:28px;border-left:none;border-top:none}
.wrap{position:absolute;inset:110px 100px;display:flex;flex-direction:column}
.tag{display:inline-block;align-self:flex-start;background:#FFC933;color:#0B1F3A;font-weight:800;letter-spacing:5px;font-size:24px;padding:14px 26px;text-transform:uppercase}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:108px;line-height:1.05;margin-top:95px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h1 .gold{color:#FFC933;font-style:italic}
.rule{width:140px;height:6px;background:#FFC933;margin:48px 0 36px}
p{font-size:44px;line-height:1.35;font-weight:600;color:#fff;max-width:860px;background:rgba(11,31,58,.82);border-left:8px solid #FFC933;padding:24px 30px;margin-left:-38px}
p b{color:#FFC933;font-weight:800}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:28px;letter-spacing:3px;font-weight:800;color:#0B1F3A;text-transform:uppercase;background:#fff;padding:18px 28px;border-radius:60px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.swipe{display:flex;align-items:center;gap:18px;background:#0B1F3A;color:#FFC933;border:3px solid #FFC933;box-shadow:0 6px 20px rgba(0,0,0,.4);font-weight:800;font-size:28px;padding:20px 34px;border-radius:60px;letter-spacing:2px}
.swipe span{font-size:38px;line-height:0}
.num{position:absolute;top:120px;right:110px;font-family:'Playfair Display',serif;font-size:30px;color:rgba(255,255,255,.55);font-weight:700}
.moon{position:absolute;width:270px;height:270px;top:30px;right:30px;filter:drop-shadow(0 0 40px rgba(255,170,60,.55)) drop-shadow(0 0 90px rgba(255,150,40,.3))}

.bignum{position:absolute;top:70px;right:100px;font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:170px;line-height:1;color:transparent;-webkit-text-stroke:3px #FFC933;opacity:.9}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:92px;line-height:1.06;margin-top:80px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h2 .gold{color:#FFC933;font-style:italic}
.why{font-size:38px;line-height:1.45;font-weight:500;color:#E8ECF3;max-width:860px;background:none;border:none;padding:0;margin:0}
.why b{color:#fff}
.fix{margin-top:44px;background:rgba(11,31,58,.88);border-left:8px solid #FFC933;padding:26px 32px;margin-left:-38px;max-width:900px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.fix .lbl{font-size:22px;letter-spacing:5px;font-weight:800;color:#FFC933;text-transform:uppercase;margin-bottom:12px}
.fix .txt{font-size:38px;line-height:1.35;font-weight:700;color:#fff}
.contact{margin-top:44px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.pill{font-size:34px;font-weight:800;padding:20px 32px;border-radius:60px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.pill.w{background:#fff;color:#0B1F3A}.pill.g{background:#FFC933;color:#0B1F3A}
</style></head><body>
<div class="shade"></div><div class="frame"></div><div class="corner tl"></div><div class="corner br"></div>
<div class="bignum">05</div>
<div class="wrap">
  <div class="tag">Mistake #4</div>
  <h2>Disappearing after the <span class="gold">sale.</span></h2>
  <div class="rule"></div>
  <p class="why">The sale is not the finish line. Silence tells them <b>they were just money.</b></p>
  <div class="fix"><div class="lbl">Do this instead</div><div class="txt">Follow up in 3 days: "How is it going? Anything I can help with?"</div></div>
  <div class="foot">
    <div class="brand">Coach Ruth Jackson</div>
    <div class="swipe">SWIPE <span>&rarr;</span></div>
  </div>
</div>
</body></html>
