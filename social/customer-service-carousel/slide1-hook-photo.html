<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0B1F3A url(slide1-bg.jpg) center bottom/1080px auto no-repeat;font-family:Montserrat,Arial,sans-serif;color:#fff;position:relative;overflow:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0B1F3A 0%,#0B1F3A 36%,rgba(11,31,58,.85) 50%,rgba(11,31,58,.55) 60%,rgba(11,31,58,.1) 75%,rgba(11,31,58,.1) 84%,rgba(11,31,58,.9) 100%)}
.frame{position:absolute;inset:40px;border:2px solid rgba(212,175,55,.55)}
.corner{position:absolute;width:70px;height:70px;border:6px solid #D4AF37}
.tl{top:28px;left:28px;border-right:none;border-bottom:none}
.br{bottom:28px;right:28px;border-left:none;border-top:none}
.wrap{position:absolute;inset:110px 100px;display:flex;flex-direction:column}
.tag{display:inline-block;align-self:flex-start;background:#D4AF37;color:#0B1F3A;font-weight:800;letter-spacing:5px;font-size:24px;padding:14px 26px;text-transform:uppercase}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:108px;line-height:1.05;margin-top:60px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h1 .gold{color:#D4AF37;font-style:italic}
.rule{width:140px;height:6px;background:#D4AF37;margin:56px 0 44px}
p{font-size:40px;line-height:1.4;font-weight:500;color:#E8ECF3;max-width:820px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
p b{color:#fff;font-weight:800}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:26px;letter-spacing:3px;font-weight:700;color:#D4AF37;text-transform:uppercase;background:rgba(11,31,58,.85);padding:12px 18px;margin-left:-18px}
.swipe{display:flex;align-items:center;gap:18px;background:#fff;color:#0B1F3A;font-weight:800;font-size:28px;padding:20px 34px;border-radius:60px;letter-spacing:2px}
.swipe span{font-size:38px;line-height:0}
.num{position:absolute;top:120px;right:110px;font-family:'Playfair Display',serif;font-size:30px;color:rgba(255,255,255,.55);font-weight:700}
</style></head><body>
<div class="shade"></div><div class="frame"></div><div class="corner tl"></div><div class="corner br"></div>
<div class="num">01</div>
<div class="wrap">
  <div class="tag">Customer Service</div>
  <h1>Your customers aren't leaving because of your <span class="gold">price.</span></h1>
  <div class="rule"></div>
  <p>They're leaving because of <b>how you made them feel.</b></p>
  <div class="foot">
    <div class="brand">Coach Ruth Jackson</div>
    <div class="swipe">SWIPE <span>&rarr;</span></div>
  </div>
</div>
</body></html>
